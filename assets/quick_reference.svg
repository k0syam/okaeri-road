<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5A4A2A" flood-opacity="0.18"/>
</filter>
<linearGradient id="forkFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#E2EFFB"/><stop offset="0.49" stop-color="#E2EFFB"/>
  <stop offset="0.51" stop-color="#FBE3EA"/><stop offset="1" stop-color="#FBE3EA"/>
</linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="4" cy="4" r="1.6" fill="#E9DFCB"/>
</pattern>
</defs>
<rect width="1080" height="1440" fill="#FBF6EC"/>
<rect width="1080" height="1440" fill="url(#dots)"/>
<text x="60.0" y="86.0" font-size="44" font-weight="900" fill="#3A3550" text-anchor="start" >おかえりロード 早見表</text>
<text x="1020.0" y="86.0" font-size="18" font-weight="normal" fill="#7A7490" text-anchor="end" >ルールブック v3</text>
<rect x="40" y="120" width="1000" height="150" rx="24" fill="#FFFFFF" stroke="#3A3550" stroke-width="3"/>
<rect x="40" y="120" width="12" height="150" rx="6" fill="#3A3550"/>
<text x="76.0" y="164.0" font-size="26" font-weight="bold" fill="#3A3550" text-anchor="start" >勝ち負け</text>
<text x="76.0" y="206.0" font-size="20" font-weight="normal" fill="#3A3550" text-anchor="start" >NPC がゴール（マス18）に着いた瞬間の体調ゲージで決まる。</text>
<text x="76.0" y="242.0" font-size="18" font-weight="normal" fill="#7A7490" text-anchor="start" >+1以上 → てんし陣営の勝ち　／　−1以下 → あくま陣営の勝ち　／　0 → 1d6（奇数てんし）</text>
<rect x="40" y="290" width="1000" height="220" rx="24" fill="#FFFFFF" stroke="#7A5CC6" stroke-width="3"/>
<rect x="40" y="290" width="12" height="220" rx="6" fill="#7A5CC6"/>
<text x="76.0" y="334.0" font-size="26" font-weight="bold" fill="#7A5CC6" text-anchor="start" >カードの出し方（いつも同じ）</text>
<text x="76.0" y="378.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >① 出すカードを陣営で決め、勝負エリアに【裏向き】で置く（出さないなら「パス」）</text>
<text x="76.0" y="414.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >② 手番プレイヤーの「せーの」で、全員のカードを【全体に公開する】</text>
<text x="76.0" y="450.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >③ ゲージを動かし、勝った／通ったカードの J・Q・K 効果を処理</text>
<text x="76.0" y="486.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >④ 使ったカードは捨て札へ。出した人はすぐ1枚補充する</text>
<rect x="40" y="530" width="1000" height="330" rx="24" fill="#FFFFFF" stroke="#D99A00" stroke-width="3"/>
<rect x="40" y="530" width="12" height="330" rx="6" fill="#D99A00"/>
<text x="76.0" y="574.0" font-size="26" font-weight="bold" fill="#D99A00" text-anchor="start" >マスごとのゲージの動き</text>
<text x="76.0" y="618.0" font-size="21" font-weight="bold" fill="#2F7FC8" text-anchor="start" >😇 健康マス</text>
<text x="270.0" y="606.0" font-size="17" font-weight="normal" fill="#3A3550" text-anchor="start" >てんしが主役・あくまは横やり（どちらもパス可）</text>
<text x="270.0" y="632.0" font-size="17" font-weight="normal" fill="#7A7490" text-anchor="start" >主役 − 横やり だけ ＋ へ（マイナスなら0）</text>
<text x="76.0" y="680.0" font-size="21" font-weight="bold" fill="#D0436A" text-anchor="start" >😈 誘惑マス</text>
<text x="270.0" y="668.0" font-size="17" font-weight="normal" fill="#3A3550" text-anchor="start" >あくまが主役・てんしは横やり（どちらもパス可）</text>
<text x="270.0" y="694.0" font-size="17" font-weight="normal" fill="#7A7490" text-anchor="start" >主役 − 横やり だけ − へ（マイナスなら0）</text>
<text x="76.0" y="742.0" font-size="21" font-weight="bold" fill="#7A5CC6" text-anchor="start" >❓ どちらでも</text>
<text x="270.0" y="730.0" font-size="17" font-weight="normal" fill="#3A3550" text-anchor="start" >両陣営とも必ず1枚（手札0なら数字0）</text>
<text x="270.0" y="756.0" font-size="17" font-weight="normal" fill="#7A7490" text-anchor="start" >大きい方の陣営へ、差の分だけ動く</text>
<text x="76.0" y="804.0" font-size="21" font-weight="bold" fill="#3A3550" text-anchor="start" >🔀 わかれ道</text>
<text x="270.0" y="792.0" font-size="17" font-weight="normal" fill="#3A3550" text-anchor="start" >どちらでもマスと同じカード勝負</text>
<text x="270.0" y="818.0" font-size="17" font-weight="normal" fill="#7A7490" text-anchor="start" >勝ったカードが 赤♥♦→健康レーン／黒♠♣→誘惑レーン</text>
<text x="76.0" y="846.0" font-size="16" font-weight="normal" fill="#7A7490" text-anchor="start" >同数は引き分け（ゲージ動かず・効果なし。わかれ道は 1d2：奇数=健康）</text>
<rect x="40" y="880" width="1000" height="250" rx="24" fill="#FFFFFF" stroke="#2F7FC8" stroke-width="3"/>
<rect x="40" y="880" width="12" height="250" rx="6" fill="#2F7FC8"/>
<text x="76.0" y="924.0" font-size="26" font-weight="bold" fill="#2F7FC8" text-anchor="start" >カードの数字と効果（勝った／通ったときだけ）</text>
<text x="76.0" y="972.0" font-size="22" font-weight="bold" fill="#3A3550" text-anchor="start" >A〜10</text>
<text x="190.0" y="972.0" font-size="20" font-weight="normal" fill="#7A7490" text-anchor="start" >1〜10</text>
<text x="270.0" y="972.0" font-size="18" font-weight="normal" fill="#3A3550" text-anchor="start" >効果なし</text>
<text x="76.0" y="1012.0" font-size="22" font-weight="bold" fill="#3A3550" text-anchor="start" >J</text>
<text x="190.0" y="1012.0" font-size="20" font-weight="normal" fill="#7A7490" text-anchor="start" >11</text>
<text x="270.0" y="1012.0" font-size="18" font-weight="normal" fill="#3A3550" text-anchor="start" >妨害：相手陣営が次に公開するカードを 数字0・効果なし に</text>
<text x="76.0" y="1052.0" font-size="22" font-weight="bold" fill="#3A3550" text-anchor="start" >Q</text>
<text x="190.0" y="1052.0" font-size="20" font-weight="normal" fill="#7A7490" text-anchor="start" >12</text>
<text x="270.0" y="1052.0" font-size="18" font-weight="normal" fill="#3A3550" text-anchor="start" >先導：NPC をさらに1マス進める（先のマスも処理）</text>
<text x="76.0" y="1092.0" font-size="22" font-weight="bold" fill="#3A3550" text-anchor="start" >K</text>
<text x="190.0" y="1092.0" font-size="20" font-weight="normal" fill="#7A7490" text-anchor="start" >13</text>
<text x="270.0" y="1092.0" font-size="18" font-weight="normal" fill="#3A3550" text-anchor="start" >大逆転：ゲージをさらに +3（自陣営側へ）</text>
<rect x="40" y="1150" width="1000" height="250" rx="24" fill="#FFFFFF" stroke="#D0436A" stroke-width="3"/>
<rect x="40" y="1150" width="12" height="250" rx="6" fill="#D0436A"/>
<text x="76.0" y="1194.0" font-size="26" font-weight="bold" fill="#D0436A" text-anchor="start" >ハプニング表（1d6）</text>
<text x="76.0" y="1242.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >1 忘れ物ニュース：何も起こらない</text>
<text x="76.0" y="1288.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >2 てんし急接近：ゲージ +2</text>
<text x="76.0" y="1334.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >3 あくまのささやき：ゲージ −2</text>
<text x="566.0" y="1242.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >4 近道発見：1マス進む（先のマスも処理）</text>
<text x="566.0" y="1288.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >5 寄り道：1マス戻る（処理しない）</text>
<text x="566.0" y="1334.0" font-size="19" font-weight="normal" fill="#3A3550" text-anchor="start" >6 気分屋：手札1枚を捨てて1枚引く</text>
</svg>